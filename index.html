					</div>
				</div>
				<div class="add-info">

							<p>40%</p>
						</div>
					</div>
					<div class="card" id="humidity">
						<div class="title"><p>Humidity</p></div>
						<div class="val">
							<i class="fa-solid fa-droplet"></i>
							<p>40%</p>
						</div>
					</div>
					<div class="card" id="wind">
						<div class="title"><p>Wind (Km/h)</p></div>
						<div class="val">
							<i class="fa-solid fa-wind"></i>
							<p>40</p>
						</div>
					</div>
				</div>
